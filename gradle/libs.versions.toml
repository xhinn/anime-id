# Katalog versi terpusat (Gradle Version Catalog).
# Semua versi plugin dan dependensi Anime.id ada di sini — satu tempat,
# supaya menaikkan versi tidak lagi berburu ke tiap berkas build.
# Angka versi di sini SAMA PERSIS dengan sebelum katalog dipakai;
# mengubah angka di sini saja sudah mengubah versi di seluruh build.

[versions]
agp = "9.1.0"
kotlin = "2.4.21"
activityCompose = "1.13.0"
compose = "1.11.2"
credentials = "1.6.0"
googleid = "1.1.1"
material3 = "1.5.0"
palette = "1.1.0"
haze = "1.6.10"
media3 = "1.11.1"
coil = "3.6.3"
splashscreen = "1.2.0"
serialization = "1.13.0"
firebaseAuth = "23.0.0"
firebaseFirestore = "25.0.0"
work = "2.12.0"
ktlint = "14.2.0"
junit = "4.13.2"
googleServices = "4.6.0"
firebaseCrashlyticsPlugin = "3.0.8"
firebaseCrashlytics = "21.1.0"

[libraries]
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
palette = { group = "androidx.palette", name = "palette", version.ref = "palette" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth", version.ref = "firebaseAuth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore", version.ref = "firebaseFirestore" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics", version.ref = "firebaseCrashlytics" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }



